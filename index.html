<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Finishing Touch Drywall - FTD Dispatch Queue</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM (Production) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel compiler for in-browser JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased">
  
  <div id="root"></div>

  <!-- Firebase v11 Modular Scripts -->
  <script type="module">
    import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc, onSnapshot, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // Your Live Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyAZCnf7hIOZnAQurfkSN8BgyXNUm5Tlffs",
      authDomain: "ftd-dispatch.firebaseapp.com",
      projectId: "ftd-dispatch",
      storageBucket: "ftd-dispatch.firebasestorage.app",
      messagingSenderId: "987894209616",
      appId: "1:987894209616:web:0ce969b28cecfe1adc4555",
      measurementId: "G-9JW2Y7YX5N"
    };

    // Attach to global window object for React access
    const firebaseApp = getApps().length === 0 ? initializeApp(firebaseConfig) : getApp();
    window.FTD_AUTH = getAuth(firebaseApp);
    window.FTD_DB = getFirestore(firebaseApp);
    window.FTD_FS = { collection, doc, setDoc, onSnapshot, updateDoc, deleteDoc, signInAnonymously, onAuthStateChanged };
  </script>

  <!-- Full Application React Component -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    // Default Admin PIN (Can be customized in state)
    const DEFAULT_ADMIN_PIN = "1234";

    // SVG Icons
    const ZapIcon = () => <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>;
    const CheckCircleIcon = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>;
    const MapPinIcon = () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path strokeLinecap="round" strokeLinejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>;
    const PhoneIcon = () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>;
    const ShieldCheckIcon = () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>;
    const LockIcon = () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>;
    const UsersIcon = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>;
    const ClipboardListIcon = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg>;
    const BarChart3Icon = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>;
    const TrashIcon = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>;
    const PlusIcon = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M12 4v16m8-8H4"/></svg>;
    const XIcon = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>;

    // Default Demo Data
    const INITIAL_JOBS = [
      {
        id: 'ftd-job-101',
        title: 'Whole House Drywall & Taping',
        clientName: 'Marcus Vance (Homeowner)',
        phone: '(555) 234-8901',
        address: '482 Maple Ave, Oakridge',
        scope: 'Hanging 1/2" drywall throughout 2,400 sq ft home. Level 4 finish required in living areas, Level 3 in garage.',
        estimatedValue: 6800,
        referralFeePct: 8,
        status: 'AVAILABLE',
        urgency: 'High',
        siteVisitDone: true,
        siteNotes: 'FTD Site visit completed. Scaffolding needed for 18ft vaulted ceiling. Delivery access clear via rear driveway.',
        claimedBy: null,
        claimedAt: null,
        createdAt: new Date(Date.now() - 3600000 * 4).toISOString(),
        category: 'Full House / Renovation'
      },
      {
        id: 'ftd-job-102',
        title: 'Water Damage Ceiling Patch & Repair',
        clientName: 'Sarah Jenkins',
        phone: '(555) 987-6543',
        address: '1120 Highland Terrace, Apt 4B',
        scope: 'Cut out 6x8 ft damaged ceiling section due to plumbing leak. Replace insulation, hang moisture board, match knockdown texture.',
        estimatedValue: 1450,
        referralFeePct: 10,
        status: 'AVAILABLE',
        urgency: 'Immediate',
        siteVisitDone: true,
        siteNotes: 'Plumber resolved leak yesterday. Subfloor thoroughly dry. Needs fast turnaround for tenant.',
        claimedBy: null,
        claimedAt: null,
        createdAt: new Date(Date.now() - 3600000 * 2).toISOString(),
        category: 'Patch & Repair'
      },
      {
        id: 'ftd-job-103',
        title: 'Basement Remodel - Taping & Mudding Only',
        clientName: 'Redwood Custom Build Inc.',
        phone: '(555) 444-1212',
        address: '742 Evergreen Blvd',
        scope: 'Hanging already complete by GC. Need professional 3-coat taping & mudding for 1,100 sq ft basement. Sand smooth for primer.',
        estimatedValue: 3200,
        referralFeePct: 7,
        status: 'CLAIMED',
        urgency: 'Medium',
        siteVisitDone: true,
        siteNotes: 'Board installation clean. All screw heads set. GC handles dust masking and cleanup.',
        claimedBy: 'Apex Drywall Systems (Dave R.)',
        claimedAt: new Date(Date.now() - 3600000 * 12).toISOString(),
        createdAt: new Date(Date.now() - 3600000 * 24).toISOString(),
        category: 'Taping & Finishing'
      }
    ];

    const MOCK_SUBS = [
      { id: 'sub-1', name: 'Apex Drywall Systems', contact: 'Dave Reynolds', phone: '(555) 777-1010', rating: 4.9, completedJobs: 14, status: 'FTD Certified Partner' },
      { id: 'sub-2', name: 'Precision Finishers LLC', contact: 'Carlos Mendez', phone: '(555) 888-2020', rating: 4.8, completedJobs: 22, status: 'FTD Certified Partner' },
      { id: 'sub-3', name: 'ProCoat Taping & Patching', contact: 'Sam Taylor', phone: '(555) 999-3030', rating: 4.7, completedJobs: 8, status: 'FTD Certified Partner' },
      { id: 'sub-4', name: 'Elite Wall Solutions', contact: 'Viktor K.', phone: '(555) 111-4040', rating: 4.9, completedJobs: 31, status: 'Top Rated Partner' }
    ];

    function App() {
      const [userRole, setUserRole] = useState('sub'); // 'admin' | 'sub'
      const [activeTab, setActiveTab] = useState('queue');
      const [currentSub, setCurrentSub] = useState(MOCK_SUBS[0]);

      // Admin Auth Security
      const [showPasscodeModal, setShowPasscodeModal] = useState(false);
      const [inputPin, setInputPin] = useState('');
      const [pinError, setPinError] = useState(false);

      // Data & Cloud State
      const [user, setUser] = useState(null);
      const [jobs, setJobs] = useState(INITIAL_JOBS);
      const [subscribers, setSubscribers] = useState(MOCK_SUBS);

      const [searchQuery, setSearchQuery] = useState('');
      const [categoryFilter, setCategoryFilter] = useState('ALL');

      // Modals
      const [selectedJob, setSelectedJob] = useState(null);
      const [showNewJobModal, setShowNewJobModal] = useState(false);
      const [showClaimSuccessModal, setShowClaimSuccessModal] = useState(null);
      const [jobToDelete, setJobToDelete] = useState(null);

      // Connect to Firestore
      useEffect(() => {
        const checkFirebase = setInterval(() => {
          if (window.FTD_AUTH && window.FTD_DB) {
            clearInterval(checkFirebase);
            const { signInAnonymously, onAuthStateChanged, collection, onSnapshot, doc, setDoc } = window.FTD_FS;

            signInAnonymously(window.FTD_AUTH);
            onAuthStateChanged(window.FTD_AUTH, (u) => {
              setUser(u);
              if (u) {
                const jobsCol = collection(window.FTD_DB, 'artifacts', 'ftd-dispatch', 'public', 'data', 'jobs');
                onSnapshot(jobsCol, (snapshot) => {
                  if (!snapshot.empty) {
                    const loaded = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                    loaded.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
                    setJobs(loaded);
                  } else {
                    INITIAL_JOBS.forEach(j => {
                      setDoc(doc(window.FTD_DB, 'artifacts', 'ftd-dispatch', 'public', 'data', 'jobs', j.id), j);
                    });
                  }
                });
              }
            });
          }
        }, 300);

        return () => clearInterval(checkFirebase);
      }, []);

      // Switch Role Guard
      const handleRoleSwitchRequest = (targetRole) => {
        if (targetRole === 'admin' && userRole !== 'admin') {
          setPinError(false);
          setInputPin('');
          setShowPasscodeModal(true);
        } else {
          setUserRole(targetRole);
          if (targetRole === 'sub' && (activeTab === 'pipeline' || activeTab === 'analytics')) {
            setActiveTab('queue');
          }
        }
      };

      const handleVerifyPasscode = (e) => {
        e.preventDefault();
        if (inputPin === DEFAULT_ADMIN_PIN) {
          setUserRole('admin');
          setShowPasscodeModal(false);
          setPinError(false);
        } else {
          setPinError(true);
        }
      };

      // FCFS Claim Job
      const handleClaimJob = async (job) => {
        if (job.status !== 'AVAILABLE') return;
        const updated = {
          ...job,
          status: 'CLAIMED',
          claimedBy: currentSub.name + ` (${currentSub.contact})`,
          claimedAt: new Date().toISOString()
        };

        if (user && window.FTD_DB) {
          const { doc, updateDoc } = window.FTD_FS;
          await updateDoc(doc(window.FTD_DB, 'artifacts', 'ftd-dispatch', 'public', 'data', 'jobs', job.id), updated);
        } else {
          setJobs(prev => prev.map(j => j.id === job.id ? updated : j));
        }
        setShowClaimSuccessModal(updated);
        if (selectedJob && selectedJob.id === job.id) setSelectedJob(updated);
      };

      // Delete Job Action
      const handleDeleteJob = async (jobId) => {
        if (user && window.FTD_DB) {
          const { doc, deleteDoc } = window.FTD_FS;
          await deleteDoc(doc(window.FTD_DB, 'artifacts', 'ftd-dispatch', 'public', 'data', 'jobs', jobId));
        } else {
          setJobs(prev => prev.filter(j => j.id !== jobId));
        }
        setJobToDelete(null);
        if (selectedJob && selectedJob.id === jobId) setSelectedJob(null);
      };

      const handleUpdateJobStatus = async (jobId, newStatus) => {
        const job = jobs.find(j => j.id === jobId);
        if (!job) return;

        const updated = { ...job, status: newStatus };
        if (newStatus === 'AVAILABLE' && !job.siteVisitDone) updated.siteVisitDone = true;

        if (user && window.FTD_DB) {
          const { doc, updateDoc } = window.FTD_FS;
          await updateDoc(doc(window.FTD_DB, 'artifacts', 'ftd-dispatch', 'public', 'data', 'jobs', jobId), updated);
        } else {
          setJobs(prev => prev.map(j => j.id === jobId ? updated : j));
        }
        if (selectedJob && selectedJob.id === jobId) setSelectedJob(updated);
      };

      const handleSaveNotes = async (jobId, newNotes, siteVisitDoneVal) => {
        const job = jobs.find(j => j.id === jobId);
        if (!job) return;

        const updated = { ...job, siteNotes: newNotes, siteVisitDone: siteVisitDoneVal };

        if (user && window.FTD_DB) {
          const { doc, updateDoc } = window.FTD_FS;
          await updateDoc(doc(window.FTD_DB, 'artifacts', 'ftd-dispatch', 'public', 'data', 'jobs', jobId), updated);
        } else {
          setJobs(prev => prev.map(j => j.id === jobId ? updated : j));
        }
        if (selectedJob && selectedJob.id === jobId) setSelectedJob(updated);
      };

      const handleCreateJob = async (jobData) => {
        const id = 'ftd-job-' + Date.now().toString().slice(-4);
        const newJob = {
          id,
          ...jobData,
          status: jobData.postImmediately ? 'AVAILABLE' : 'INCOMING',
          claimedBy: null,
          claimedAt: null,
          createdAt: new Date().toISOString()
        };

        if (user && window.FTD_DB) {
          const { doc, setDoc } = window.FTD_FS;
          await setDoc(doc(window.FTD_DB, 'artifacts', 'ftd-dispatch', 'public', 'data', 'jobs', id), newJob);
        } else {
          setJobs(prev => [newJob, ...prev]);
        }
        setShowNewJobModal(false);
      };

      // Filters
      const availableQueue = jobs.filter(j => j.status === 'AVAILABLE');
      const filteredJobs = jobs.filter(j => {
        const matchesSearch = j.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              j.address.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              j.scope.toLowerCase().includes(searchQuery.toLowerCase());
        const matchesCat = categoryFilter === 'ALL' || j.category === categoryFilter;
        return matchesSearch && matchesCat;
      });

      const totalValueAvailable = availableQueue.reduce((acc, curr) => acc + (curr.estimatedValue || 0), 0);
      const totalReferralPipeline = jobs.reduce((acc, curr) => acc + ((curr.estimatedValue * (curr.referralFeePct / 100)) || 0), 0);

      return (
        <div className="min-h-screen flex flex-col">
          
          {/* HEADER */}
          <header className="sticky top-0 z-30 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 shadow-xl">
            <div className="max-w-7xl mx-auto px-4 py-3 flex flex-col sm:flex-row items-center justify-between gap-4">
              
              <div className="flex items-center space-x-3 w-full sm:w-auto justify-between sm:justify-start">
                <div className="flex items-center space-x-3">
                  <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 via-orange-500 to-amber-300 flex items-center justify-center text-slate-950 font-black shadow-md border border-amber-300/40 text-xs">
                    FTD
                  </div>
                  <div>
                    <h1 className="text-base font-black tracking-tight text-white uppercase">The Finishing Touch</h1>
                    <p className="text-[11px] text-amber-400 font-semibold">Drywall Dispatch Queue Network</p>
                  </div>
                </div>

                <button 
                  onClick={() => handleRoleSwitchRequest(userRole === 'admin' ? 'sub' : 'admin')}
                  className="sm:hidden text-[11px] font-bold px-2.5 py-1 rounded bg-slate-800 border border-slate-700 text-amber-400 flex items-center gap-1"
                >
                  <LockIcon />
                  {userRole === 'admin' ? 'Lock Admin' : 'Admin Login'}
                </button>
              </div>

              <div className="flex items-center gap-3 w-full sm:w-auto justify-end">
                <div className="bg-slate-950 p-1 rounded-xl border border-slate-800 flex items-center text-xs">
                  <button
                    onClick={() => handleRoleSwitchRequest('sub')}
                    className={`px-3 py-1.5 rounded-lg font-bold transition-all ${userRole === 'sub' ? 'bg-amber-500 text-slate-950' : 'text-slate-400 hover:text-white'}`}
                  >
                    Sub Portal
                  </button>
                  <button
                    onClick={() => handleRoleSwitchRequest('admin')}
                    className={`px-3 py-1.5 rounded-lg font-bold transition-all flex items-center gap-1 ${userRole === 'admin' ? 'bg-amber-500 text-slate-950' : 'text-slate-400 hover:text-white'}`}
                  >
                    {userRole !== 'admin' && <LockIcon />}
                    FTD Admin
                  </button>
                </div>

                {userRole === 'sub' && (
                  <select
                    value={currentSub.id}
                    onChange={(e) => setCurrentSub(MOCK_SUBS.find(s => s.id === e.target.value))}
                    className="bg-slate-800 border border-slate-700 text-xs rounded-xl px-2.5 py-2 text-slate-200 hidden lg:block"
                  >
                    {MOCK_SUBS.map(sub => <option key={sub.id} value={sub.id}>📱 Sub: {sub.name}</option>)}
                  </select>
                )}

                {userRole === 'admin' && (
                  <button
                    onClick={() => setShowNewJobModal(true)}
                    className="bg-amber-500 text-slate-950 font-black px-3.5 py-2 rounded-xl text-xs flex items-center gap-1.5 shadow-md hover:bg-amber-400"
                  >
                    <PlusIcon />
                    <span>Post Lead</span>
                  </button>
                )}
              </div>
            </div>

            {/* TAB NAVIGATION */}
            <div className="max-w-7xl mx-auto px-4 border-t border-slate-800/80">
              <nav className="flex space-x-6 overflow-x-auto no-scrollbar py-2">
                <button
                  onClick={() => setActiveTab('queue')}
                  className={`flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap ${activeTab === 'queue' ? 'bg-slate-800 text-amber-400 border border-slate-700' : 'text-slate-400'}`}
                >
                  <ZapIcon /> Live FCFS Queue
                  {availableQueue.length > 0 && <span className="ml-1 bg-amber-500/20 text-amber-300 text-[10px] px-1.5 py-0.5 rounded-full font-bold">{availableQueue.length}</span>}
                </button>

                {userRole === 'admin' && (
                  <button
                    onClick={() => setActiveTab('pipeline')}
                    className={`flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap ${activeTab === 'pipeline' ? 'bg-slate-800 text-amber-400 border border-slate-700' : 'text-slate-400'}`}
                  >
                    <ClipboardListIcon /> Dispatch Pipeline
                  </button>
                )}

                <button
                  onClick={() => setActiveTab('subs')}
                  className={`flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap ${activeTab === 'subs' ? 'bg-slate-800 text-amber-400 border border-slate-700' : 'text-slate-400'}`}
                >
                  <UsersIcon /> Partner Network
                </button>

                {userRole === 'admin' && (
                  <button
                    onClick={() => setActiveTab('analytics')}
                    className={`flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap ${activeTab === 'analytics' ? 'bg-slate-800 text-amber-400 border border-slate-700' : 'text-slate-400'}`}
                  >
                    <BarChart3Icon /> Referral Revenue
                  </button>
                )}
              </nav>
            </div>
          </header>

          {/* MAIN CONTAINER */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 py-6">
            
            {/* STATS METRICS */}
            <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4">
                <span className="text-xs text-slate-400">Available Queue</span>
                <p className="text-2xl font-black text-amber-400 mt-1">{availableQueue.length} Jobs</p>
                <p className="text-[11px] text-slate-500 mt-1">${totalValueAvailable.toLocaleString()} Total Value</p>
              </div>
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4">
                <span className="text-xs text-slate-400">Claimed & Handed Off</span>
                <p className="text-2xl font-black text-slate-100 mt-1">{jobs.filter(j => j.status === 'CLAIMED').length}</p>
                <p className="text-[11px] text-emerald-400 mt-1">Self-Managed by Subs</p>
              </div>
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4">
                <span className="text-xs text-slate-400">FTD Referral Cut</span>
                <p className="text-2xl font-black text-emerald-400 mt-1">${Math.round(totalReferralPipeline).toLocaleString()}</p>
                <p className="text-[11px] text-slate-500 mt-1">Est. Comm. Earned</p>
              </div>
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4">
                <span className="text-xs text-slate-400 font-medium">Sync Status</span>
                <p className="text-xs font-bold text-emerald-400 mt-2">● Firestore Live</p>
              </div>
            </div>

            {/* TAB 1: LIVE QUEUE */}
            {activeTab === 'queue' && (
              <div className="space-y-6">
                
                {/* Search Bar */}
                <div className="flex flex-col sm:flex-row items-center justify-between gap-4 bg-slate-900/60 p-4 rounded-2xl border border-slate-800">
                  <h2 className="text-base font-bold text-white flex items-center gap-2">
                    <ZapIcon /> First-Come, First-Serve Job Board
                  </h2>
                  <div className="flex items-center gap-2 w-full sm:w-auto">
                    <input
                      type="text"
                      placeholder="Search jobs..."
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-slate-200"
                    />
                    <select
                      value={categoryFilter}
                      onChange={(e) => setCategoryFilter(e.target.value)}
                      className="bg-slate-950 border border-slate-800 text-xs rounded-xl px-3 py-1.5 text-slate-300"
                    >
                      <option value="ALL">All Categories</option>
                      <option value="Patch & Repair">Patch & Repair</option>
                      <option value="Taping & Finishing">Taping & Finishing</option>
                      <option value="Full House / Renovation">Full House</option>
                      <option value="Commercial">Commercial</option>
                    </select>
                  </div>
                </div>

                {/* Queue Cards */}
                <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                  {filteredJobs.filter(j => j.status === 'AVAILABLE').map((job) => (
                    <div key={job.id} className="bg-slate-900 border border-amber-500/30 hover:border-amber-500 rounded-2xl p-5 space-y-3 relative">
                      <div className="flex justify-between items-start">
                        <div>
                          <span className="text-[10px] font-bold text-amber-400 bg-amber-500/10 px-2.5 py-1 rounded-full border border-amber-500/30 uppercase">
                            AVAILABLE FOR CLAIM
                          </span>
                          <h3 className="text-base font-bold text-white mt-2">{job.title}</h3>
                          <p className="text-xs text-slate-400">{job.address}</p>
                        </div>
                        <div className="bg-slate-950 p-2.5 rounded-xl border border-slate-800 text-right">
                          <span className="text-xs text-slate-400 block">Payout</span>
                          <span className="text-lg font-black text-emerald-400">${job.estimatedValue}</span>
                        </div>
                      </div>

                      <div className="bg-slate-950/60 p-3 rounded-xl border border-slate-800 text-xs text-slate-300">
                        <strong>Scope:</strong> {job.scope}
                      </div>

                      {job.siteNotes && (
                        <div className="bg-slate-800/40 p-2 rounded-lg text-[11px] text-slate-400 italic">
                          "FTD Site Visit Note: {job.siteNotes}"
                        </div>
                      )}

                      <div className="pt-2 border-t border-slate-800 flex justify-between items-center">
                        <button onClick={() => setSelectedJob(job)} className="text-xs text-slate-400 hover:text-white underline">
                          View Details & Notes
                        </button>
                        {userRole === 'sub' ? (
                          <button
                            onClick={() => handleClaimJob(job)}
                            className="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black px-4 py-2 rounded-xl text-xs flex items-center gap-1.5"
                          >
                            <ZapIcon /> CLAIM THIS JOB NOW
                          </button>
                        ) : (
                          <div className="flex items-center gap-2">
                            <button onClick={() => setJobToDelete(job)} className="p-1.5 text-red-400 hover:bg-red-500/10 rounded-lg" title="Delete Job">
                              <TrashIcon />
                            </button>
                            <span className="text-xs text-emerald-400 font-bold">FTD Cut: +${Math.round(job.estimatedValue * (job.referralFeePct / 100))}</span>
                          </div>
                        )}
                      </div>
                    </div>
                  ))}
                </div>

              </div>
            )}

            {/* TAB 2: DISPATCH PIPELINE (KANBAN) */}
            {activeTab === 'pipeline' && userRole === 'admin' && (
              <div className="space-y-6">
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  {/* Incoming */}
                  <div className="bg-slate-900/60 border border-slate-800 rounded-2xl p-4">
                    <h3 className="text-xs font-bold text-slate-300 mb-3 pb-2 border-b border-slate-800">Incoming Calls / Leads</h3>
                    <div className="space-y-3">
                      {jobs.filter(j => j.status === 'INCOMING').map(job => (
                        <div key={job.id} className="bg-slate-950 border border-slate-800 p-3 rounded-xl space-y-2">
                          <div className="flex justify-between items-start">
                            <h4 className="text-xs font-bold text-white">{job.title}</h4>
                            <button onClick={() => setJobToDelete(job)} className="text-slate-500 hover:text-red-400"><TrashIcon /></button>
                          </div>
                          <p className="text-[11px] text-slate-400">{job.address}</p>
                          <div className="flex justify-between items-center pt-2 border-t border-slate-800">
                            <button onClick={() => setSelectedJob(job)} className="text-[10px] text-blue-400">+ Notes</button>
                            <button onClick={() => handleUpdateJobStatus(job.id, 'AVAILABLE')} className="bg-amber-500 text-slate-950 font-bold px-2 py-1 rounded text-[10px]">Publish →</button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Live Queue */}
                  <div className="bg-slate-900/60 border border-slate-800 rounded-2xl p-4">
                    <h3 className="text-xs font-bold text-amber-400 mb-3 pb-2 border-b border-slate-800">Live Sub Queue</h3>
                    <div className="space-y-3">
                      {jobs.filter(j => j.status === 'AVAILABLE').map(job => (
                        <div key={job.id} className="bg-slate-950 border border-amber-500/30 p-3 rounded-xl space-y-2">
                          <div className="flex justify-between items-start">
                            <h4 className="text-xs font-bold text-amber-300">{job.title}</h4>
                            <button onClick={() => setJobToDelete(job)} className="text-slate-500 hover:text-red-400"><TrashIcon /></button>
                          </div>
                          <p className="text-[11px] text-slate-400">${job.estimatedValue}</p>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Claimed */}
                  <div className="bg-slate-900/60 border border-slate-800 rounded-2xl p-4">
                    <h3 className="text-xs font-bold text-emerald-400 mb-3 pb-2 border-b border-slate-800">Handed Off / Claimed</h3>
                    <div className="space-y-3">
                      {jobs.filter(j => j.status === 'CLAIMED').map(job => (
                        <div key={job.id} className="bg-slate-950 border border-emerald-500/30 p-3 rounded-xl space-y-2">
                          <div className="flex justify-between items-start">
                            <h4 className="text-xs font-bold text-white">{job.title}</h4>
                            <button onClick={() => setJobToDelete(job)} className="text-slate-500 hover:text-red-400"><TrashIcon /></button>
                          </div>
                          <p className="text-[10px] text-emerald-400 font-bold">Assigned: {job.claimedBy}</p>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 3: SUBS DIRECTORY */}
            {activeTab === 'subs' && (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {subscribers.map((sub) => (
                  <div key={sub.id} className="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex items-start justify-between">
                    <div>
                      <h3 className="text-sm font-bold text-white">{sub.name}</h3>
                      <p className="text-xs text-slate-400">{sub.contact} • {sub.phone}</p>
                      <span className="text-amber-400 text-xs font-bold mt-2 block">★ {sub.rating} Rating ({sub.completedJobs} Jobs)</span>
                    </div>
                    <span className="text-[10px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-1 rounded font-bold">COI Insured</span>
                  </div>
                ))}
              </div>
            )}

            {/* TAB 4: REVENUE ANALYTICS */}
            {activeTab === 'analytics' && userRole === 'admin' && (
              <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
                  <span className="text-xs text-slate-400">Total Referred Volume</span>
                  <p className="text-2xl font-black text-white mt-1">${jobs.reduce((a, b) => a + b.estimatedValue, 0).toLocaleString()}</p>
                </div>
                <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
                  <span className="text-xs text-slate-400">FTD Finder's Fees Earned</span>
                  <p className="text-2xl font-black text-emerald-400 mt-1">${Math.round(totalReferralPipeline).toLocaleString()}</p>
                </div>
                <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
                  <span className="text-xs text-slate-400">Call Conversion Rate</span>
                  <p className="text-2xl font-black text-amber-400 mt-1">96.4%</p>
                </div>
              </div>
            )}

          </main>

          {/* PASSCODE AUTH MODAL */}
          {showPasscodeModal && (
            <div className="fixed inset-0 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl max-w-xs w-full text-center space-y-4">
                <div className="w-12 h-12 bg-amber-500/20 text-amber-400 border border-amber-500/30 rounded-full flex items-center justify-center mx-auto">
                  <LockIcon />
                </div>

                <div>
                  <h3 className="text-base font-bold text-white">Admin Security Access</h3>
                  <p className="text-xs text-slate-400 mt-1">Enter passcode to switch to FTD Admin view.</p>
                </div>

                <form onSubmit={handleVerifyPasscode} className="space-y-3">
                  <input
                    type="password"
                    maxLength="6"
                    placeholder="Enter PIN (Default: 1234)"
                    value={inputPin}
                    onChange={(e) => setInputPin(e.target.value)}
                    className="w-full text-center tracking-widest text-lg font-bold bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-amber-400 focus:outline-none focus:border-amber-500"
                    autoFocus
                  />

                  {pinError && <p className="text-[11px] text-red-400">Incorrect Passcode. Try 1234</p>}

                  <div className="flex gap-2">
                    <button type="button" onClick={() => setShowPasscodeModal(false)} className="w-1/2 py-2 text-xs text-slate-400">Cancel</button>
                    <button type="submit" className="w-1/2 bg-amber-500 text-slate-950 font-bold py-2 rounded-xl text-xs">Unlock</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: DETAILS & SITE NOTES */}
          {selectedJob && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-6 space-y-4 shadow-2xl relative">
                <button onClick={() => setSelectedJob(null)} className="absolute right-4 top-4 text-slate-400 hover:text-white"><XIcon /></button>
                
                <div className="flex justify-between items-start">
                  <div>
                    <h3 className="text-lg font-bold text-white">{selectedJob.title}</h3>
                    <p className="text-xs text-slate-400">{selectedJob.address}</p>
                  </div>
                  {userRole === 'admin' && (
                    <button onClick={() => setJobToDelete(selectedJob)} className="text-red-400 hover:bg-red-500/10 p-2 rounded-lg text-xs flex items-center gap-1 border border-red-500/20">
                      <TrashIcon /> Delete Job
                    </button>
                  )}
                </div>
                
                <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 text-xs">
                  <span className="text-slate-500 block uppercase font-bold text-[10px]">Contact</span>
                  <p className="text-slate-200">{selectedJob.clientName} • <span className="text-amber-400 font-mono">{selectedJob.phone}</span></p>
                </div>

                <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 text-xs text-slate-300">
                  <strong>Scope:</strong> {selectedJob.scope}
                </div>

                <div className="space-y-2">
                  <h4 className="text-xs font-bold text-slate-300 uppercase">FTD Site Visit Notes</h4>
                  {userRole === 'admin' ? (
                    <textarea
                      rows="3"
                      value={selectedJob.siteNotes || ''}
                      onChange={(e) => setSelectedJob({...selectedJob, siteNotes: e.target.value})}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-slate-200"
                    />
                  ) : (
                    <p className="text-xs text-slate-400 italic bg-slate-950 p-3 rounded-xl border border-slate-800">{selectedJob.siteNotes || 'No notes entered'}</p>
                  )}
                </div>

                <div className="flex justify-end gap-2 pt-2">
                  {userRole === 'admin' && (
                    <button onClick={() => handleSaveNotes(selectedJob.id, selectedJob.siteNotes, selectedJob.siteVisitDone)} className="bg-blue-600 text-white font-bold px-4 py-2 rounded-xl text-xs">Save Notes</button>
                  )}
                  {userRole === 'sub' && selectedJob.status === 'AVAILABLE' && (
                    <button onClick={() => { handleClaimJob(selectedJob); setSelectedJob(null); }} className="bg-amber-500 text-slate-950 font-black px-4 py-2 rounded-xl text-xs">CLAIM THIS JOB NOW</button>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* MODAL: DELETE CONFIRMATION */}
          {jobToDelete && (
            <div className="fixed inset-0 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-red-500/50 p-6 rounded-2xl max-w-sm w-full text-center space-y-3">
                <div className="w-12 h-12 bg-red-500/20 text-red-400 border border-red-500/30 rounded-full flex items-center justify-center mx-auto">
                  <TrashIcon />
                </div>
                <h3 className="text-base font-bold text-white">Delete Job Lead?</h3>
                <p className="text-xs text-slate-400">Are you sure you want to permanently delete <strong>{jobToDelete.title}</strong>? This action cannot be undone.</p>
                <div className="flex gap-2 pt-2">
                  <button onClick={() => setJobToDelete(null)} className="w-1/2 py-2 text-xs text-slate-400">Cancel</button>
                  <button onClick={() => handleDeleteJob(jobToDelete.id)} className="w-1/2 bg-red-500 text-white font-bold py-2 rounded-xl text-xs">Confirm Delete</button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL: POST LEAD */}
          {showNewJobModal && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl max-w-md w-full space-y-3 text-xs relative">
                <button onClick={() => setShowNewJobModal(false)} className="absolute right-4 top-4 text-slate-400 hover:text-white"><XIcon /></button>
                <h3 className="text-base font-bold text-white">Post New FTD Lead</h3>
                <form onSubmit={(e) => {
                  e.preventDefault();
                  const fd = new FormData(e.target);
                  handleCreateJob({
                    title: fd.get('title'),
                    clientName: fd.get('clientName'),
                    phone: fd.get('phone'),
                    address: fd.get('address'),
                    estimatedValue: Number(fd.get('estimatedValue')),
                    referralFeePct: Number(fd.get('referralFeePct')),
                    scope: fd.get('scope'),
                    siteNotes: fd.get('siteNotes'),
                    postImmediately: true
                  });
                }} className="space-y-3">
                  <input required name="title" placeholder="Job Title" className="w-full bg-slate-950 p-2.5 rounded-xl border border-slate-800 text-white" />
                  <div className="grid grid-cols-2 gap-2">
                    <input required name="clientName" placeholder="Client Name" className="w-full bg-slate-950 p-2.5 rounded-xl border border-slate-800 text-white" />
                    <input required name="phone" placeholder="Phone" className="w-full bg-slate-950 p-2.5 rounded-xl border border-slate-800 text-white" />
                  </div>
                  <input required name="address" placeholder="Address" className="w-full bg-slate-950 p-2.5 rounded-xl border border-slate-800 text-white" />
                  <div className="grid grid-cols-2 gap-2">
                    <input required type="number" name="estimatedValue" defaultValue="2500" placeholder="Job Value $" className="w-full bg-slate-950 p-2.5 rounded-xl border border-slate-800 text-white" />
                    <input required type="number" name="referralFeePct" defaultValue="8" placeholder="FTD % Cut" className="w-full bg-slate-950 p-2.5 rounded-xl border border-slate-800 text-white" />
                  </div>
                  <textarea required name="scope" placeholder="Work Scope" rows="2" className="w-full bg-slate-950 p-2.5 rounded-xl border border-slate-800 text-white" />
                  <textarea name="siteNotes" placeholder="Site Visit Notes" rows="2" className="w-full bg-slate-950 p-2.5 rounded-xl border border-slate-800 text-white" />
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setShowNewJobModal(false)} className="px-3 py-1.5 text-slate-400">Cancel</button>
                    <button type="submit" className="bg-amber-500 text-slate-950 font-bold px-4 py-1.5 rounded-xl">Post Lead</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: CLAIM SUCCESS */}
          {showClaimSuccessModal && (
            <div className="fixed inset-0 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-emerald-500 p-6 rounded-2xl max-w-sm w-full text-center space-y-3">
                <div className="text-emerald-400 font-black text-xl">✓ JOB CLAIMED!</div>
                <p className="text-xs text-slate-300">You locked in: <strong>{showClaimSuccessModal.title}</strong></p>
                <p className="text-xs text-amber-400 font-mono">Client Phone: {showClaimSuccessModal.phone}</p>
                <button onClick={() => setShowClaimSuccessModal(null)} className="w-full bg-emerald-500 text-slate-950 font-black py-2 rounded-xl text-xs">
                  RETURN TO QUEUE
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
